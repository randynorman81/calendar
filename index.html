<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Class Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap">
<link rel="stylesheet" href="assets/style.css">
<link rel="icon" href="assets/logo.png">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="index.html" class="brand">
      <img src="assets/logo.png" alt="Social Circle High School logo" class="school-logo">
      <span class="brand-text">
        <p class="brand-eyebrow">SCHS Computer Science</p>
        <h1 class="brand-title">Class Calendar</h1>
      </span>
    </a>
    <div class="header-actions">
      <a class="btn btn-ghost" href="admin.html">Teacher Admin</a>
    </div>
  </div>
</header>

<main>
  <div class="hero">
    <h2>Find your class period</h2>
    <p>Pick your period, then click any day to see what's due.</p>
  </div>

  <div class="card">
    <div class="field">
      <label for="slot-select">My period</label>
      <select id="slot-select">
        <option value="">Choose a period&hellip;</option>
      </select>
    </div>
  </div>

  <div id="calendar-card" class="calendar-card" style="display:none;">
    <div class="calendar-header">
      <button type="button" class="btn btn-sm" id="cal-prev">&larr;</button>
      <h3 id="cal-month-label"></h3>
      <button type="button" class="btn btn-sm" id="cal-next">&rarr;</button>
    </div>
    <div class="calendar-weekdays">
      <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
    </div>
    <div class="calendar-grid" id="calendar-grid"></div>
    <div class="calendar-legend">
      <span><span class="legend-dot legend-meets"></span> Class meets</span>
      <span><span class="legend-dot legend-event"></span> Has an event</span>
      <span><span class="legend-dot legend-holiday"></span> No school</span>
    </div>
  </div>

  <div id="day-detail"></div>
</main>

<footer class="site-footer">
  Social Circle High School &middot; Computer Science &middot; questions? see Mr. Norman
</footer>

<script src="assets/api.js"></script>
<script>
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str == null ? '' : String(str);
  return div.innerHTML;
}

const TYPE_LABEL = { quiz: 'Quiz', test: 'Test', assignment: 'Assignment' };
const WEEKDAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
const MONTH_NAMES = ["January","February","March","April","May","June","July","August","September","October","November","December"];

function pad2(n) { return String(n).padStart(2, '0'); }
function toDateStr(y, m, d) { return `${y}-${pad2(m + 1)}-${pad2(d)}`; }
function weekdayName(dateStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  return WEEKDAYS[new Date(y, m - 1, d).getDay()];
}
function formatDateLong(dateStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  return new Date(y, m - 1, d).toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
}

function slotMeetsOnDate(slot, dateStr, fridayTypes, holidays) {
  if (holidays.has(dateStr)) return false;
  const wd = weekdayName(dateStr);
  if (slot.dayType === 'A') {
    if (wd === 'Monday' || wd === 'Wednesday') return true;
    if (wd === 'Friday') return fridayTypes[dateStr] === 'A';
    return false;
  }
  if (wd === 'Tuesday' || wd === 'Thursday') return true;
  if (wd === 'Friday') return fridayTypes[dateStr] === 'B';
  return false;
}

const slotSelect = document.getElementById('slot-select');
const calendarCard = document.getElementById('calendar-card');
const calendarGrid = document.getElementById('calendar-grid');
const monthLabel = document.getElementById('cal-month-label');
const dayDetail = document.getElementById('day-detail');

let SLOTS = [];
let currentSlot = null;
let currentEvents = [];
let fridayTypes = {};
let holidays = new Set();
let selectedDate = null;

const today = new Date();
let viewYear = today.getFullYear();
let viewMonth = today.getMonth();

async function loadSlots() {
  const res = await apiGet('slots');
  SLOTS = res.slots || [];
  SLOTS.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s.id;
    opt.textContent = `${s.label} (${s.dayType}-day)`;
    slotSelect.appendChild(opt);
  });
  const saved = sessionStorage.getItem('calendarSlot');
  if (saved) {
    slotSelect.value = saved;
    loadSlot(saved);
  }
}

async function loadSlot(slotId) {
  if (!slotId) { calendarCard.style.display = 'none'; dayDetail.innerHTML = ''; return; }
  sessionStorage.setItem('calendarSlot', slotId);
  currentSlot = SLOTS.find(s => s.id === slotId);
  dayDetail.innerHTML = '<div class="loading">Loading&hellip;</div>';

  try {
    const [eventsRes, fridayRes, holidaysRes] = await Promise.all([
      apiGet('publicEvents', { slot: slotId }),
      apiGet('fridayTypes'),
      apiGet('holidays')
    ]);
    if (eventsRes.error) {
      dayDetail.innerHTML = `<div class="alert alert-error">${escapeHtml(eventsRes.error)}</div>`;
      return;
    }
    currentEvents = eventsRes.events;
    fridayTypes = fridayRes.fridayTypes || {};
    holidays = new Set(holidaysRes.holidays || []);
    dayDetail.innerHTML = '';

    // Jump to the month of the nearest upcoming event, or today if none.
    const todayStr = toDateStr(today.getFullYear(), today.getMonth(), today.getDate());
    const upcoming = currentEvents.find(e => e.date >= todayStr);
    const anchor = upcoming ? upcoming.date : todayStr;
    const [ay, am] = anchor.split('-').map(Number);
    viewYear = ay;
    viewMonth = am - 1;

    calendarCard.style.display = 'block';
    renderCalendar();
  } catch (err) {
    dayDetail.innerHTML = '<div class="alert alert-error">Could not reach the server. This page needs to be running on Netlify (with functions deployed) to work.</div>';
  }
}

function eventsOn(dateStr) {
  return currentEvents.filter(e => e.date === dateStr);
}

function renderCalendar() {
  monthLabel.textContent = `${MONTH_NAMES[viewMonth]} ${viewYear}`;

  const firstOfMonth = new Date(viewYear, viewMonth, 1);
  const startWeekday = firstOfMonth.getDay();
  const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
  const todayStr = toDateStr(today.getFullYear(), today.getMonth(), today.getDate());

  let cells = '';
  for (let i = 0; i < startWeekday; i++) {
    cells += '<div class="calendar-cell empty"></div>';
  }

  for (let day = 1; day <= daysInMonth; day++) {
    const dStr = toDateStr(viewYear, viewMonth, day);
    const meets = currentSlot ? slotMeetsOnDate(currentSlot, dStr, fridayTypes, holidays) : false;
    const isHoliday = holidays.has(dStr);
    const dayEvents = eventsOn(dStr);
    const classes = ['calendar-cell'];
    if (dStr === todayStr) classes.push('today');
    if (meets) classes.push('meets');
    if (isHoliday) classes.push('holiday');
    if (dayEvents.length > 0) classes.push('has-events');
    if (dStr === selectedDate) classes.push('selected');

    cells += `
      <button type="button" class="${classes.join(' ')}" data-date="${dStr}">
        <span class="cell-num">${day}</span>
        ${dayEvents.length > 0 ? `<span class="cell-dots">${dayEvents.slice(0, 3).map(e => `<span class="event-dot event-dot-${e.type}"></span>`).join('')}</span>` : ''}
      </button>
    `;
  }

  calendarGrid.innerHTML = cells;
  calendarGrid.querySelectorAll('.calendar-cell:not(.empty)').forEach(cell => {
    cell.addEventListener('click', () => {
      selectedDate = cell.dataset.date;
      renderCalendar();
      renderDayDetail(selectedDate);
    });
  });

  if (selectedDate) renderDayDetail(selectedDate);
}

function renderDayDetail(dateStr) {
  const meets = currentSlot ? slotMeetsOnDate(currentSlot, dateStr, fridayTypes, holidays) : false;
  const isHoliday = holidays.has(dateStr);
  const dayEvents = eventsOn(dateStr);

  let statusLine;
  if (isHoliday) {
    statusLine = '<p class="hint">No school today.</p>';
  } else if (!meets) {
    statusLine = `<p class="hint">${escapeHtml(currentSlot.label)} doesn't meet today.</p>`;
  } else if (dayEvents.length === 0) {
    statusLine = '<p class="hint">Nothing scheduled.</p>';
  } else {
    statusLine = '';
  }

  dayDetail.innerHTML = `
    <div class="card">
      <h2 style="margin-top:0;">${formatDateLong(dateStr)}</h2>
      ${statusLine}
      ${dayEvents.length > 0 ? dayEvents.map(e => `
        <div class="note">
          <strong>${escapeHtml(TYPE_LABEL[e.type] || 'Assignment')}:</strong> ${escapeHtml(e.title)}
          ${e.notes ? `<div class="hint" style="margin-top:4px;">${escapeHtml(e.notes)}</div>` : ''}
        </div>
      `).join('') : ''}
    </div>
  `;
}

document.getElementById('cal-prev').addEventListener('click', () => {
  viewMonth--;
  if (viewMonth < 0) { viewMonth = 11; viewYear--; }
  renderCalendar();
});
document.getElementById('cal-next').addEventListener('click', () => {
  viewMonth++;
  if (viewMonth > 11) { viewMonth = 0; viewYear++; }
  renderCalendar();
});

slotSelect.addEventListener('change', () => {
  selectedDate = null;
  loadSlot(slotSelect.value);
});
loadSlots();
</script>
</body>
</html>
